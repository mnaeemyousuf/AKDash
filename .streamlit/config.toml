# AKDash theme: textile indigo + thread gold for the app chrome; charts keep the validated data palette.
# Light and dark are separate, validated palettes (not an automatic flip);
# users switch between them (or follow the system) from the ⋮ menu → Settings.

[client]
toolbarMode = "minimal"          # hide the developer toolbar / Deploy button

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#34449f"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#256abf"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"

[theme.dark]
primaryColor = "#8e9bf2"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
linkColor = "#86b6ef"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#141413"
secondaryBackgroundColor = "#1a1a19"
