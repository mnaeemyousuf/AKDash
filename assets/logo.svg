<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AKDash">
  <defs>
    <linearGradient id="akBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121838"/>
      <stop offset="1" stop-color="#34449f"/>
    </linearGradient>
    <linearGradient id="akGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4d98b"/>
      <stop offset="1" stop-color="#c79a3a"/>
    </linearGradient>
    <pattern id="akWeave" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="6" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#akBg)"/>
  <rect width="64" height="64" rx="16" fill="url(#akWeave)"/>
  <!-- bars 1 and 3 sit under the thread -->
  <rect x="13" y="35" width="9" height="17" rx="2.5" fill="#ffffff" opacity="0.92"/>
  <rect x="42" y="15" width="9" height="37" rx="2.5" fill="#ffffff" opacity="0.92"/>
  <!-- the gold thread -->
  <path d="M7 45 C 16 33, 22 50, 31 36 S 47 18, 57 12" fill="none" stroke="url(#akGold)" stroke-width="3.6"
        stroke-linecap="round"/>
  <!-- bar 2 passes over the thread: woven -->
  <rect x="27.5" y="25" width="9" height="27" rx="2.5" fill="#ffffff"/>
  <circle cx="57" cy="12" r="3.2" fill="#f4d98b"/>
</svg>
